# Checks and builds the theme on every pull request and push to main, and
# keeps the deployable copy (production/) as a workflow artifact.
#
# Deploying is manual: Actions -> CI -> Run workflow on main, tick "deploy".
# It uploads production/ to the server with the FTP_* / REMOTE_HOST secrets.
# Set the repository variable FTP_PROTOCOL to "ftps" once the host offers it.
#
# Actions are pinned to commit SHAs (tag in the comment).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload production/ to the server (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Vite+ pre-commit hook is for local commits only.
  VP_GIT_HOOKS: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node, pnpm (packageManager) and Vite+ (the lockfile's vite-plus),
      # then `vp install` with a dependency cache.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Format and lint (Oxfmt, Oxlint)
        run: vp check

      - name: Stylelint
        run: vpr style:lint

      - name: Build and package
        run: vpr build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production
          path: production/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production
          path: production

      - uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: ./production/
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
