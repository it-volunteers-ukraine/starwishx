# Vite+ installed as a project-local CLI (devDependency vite-plus): its own
# tree (vitest -> vite peer) must resolve "vite" to Vite+'s core and use the
# Vitest it bundles. Keep both in step with the installed vite-plus version
# (`pnpm exec vp toolchain`). See https://viteplus.dev/guide/local-cli
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest@*: 5.0.4

peerDependencyRules:
  allowedVersions:
    # vite-plus-core is Vite 8 under Vite+'s own version number.
    vite: "*"

allowBuilds:
  # Pulled in through vite-plus-core's sass. Its install script only builds
  # from source when no prebuilt binary matches - the prebuilt one is used.
  "@parcel/watcher": false

minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0 || 1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0 || 1.4.0"
  - sass-embedded-all-unknown@1.105.2
  - sass-embedded-android-arm64@1.105.2
  - sass-embedded-android-arm@1.105.2
  - sass-embedded-android-riscv64@1.105.2
  - sass-embedded-android-x64@1.105.2
  - sass-embedded-darwin-arm64@1.105.2
  - sass-embedded-darwin-x64@1.105.2
  - sass-embedded-linux-arm64@1.105.2
  - sass-embedded-linux-arm@1.105.2
  - sass-embedded-linux-musl-arm64@1.105.2
  - sass-embedded-linux-musl-arm@1.105.2
  - sass-embedded-linux-musl-riscv64@1.105.2
  - sass-embedded-linux-musl-x64@1.105.2
  - sass-embedded-linux-riscv64@1.105.2
  - sass-embedded-linux-x64@1.105.2
  - sass-embedded-unknown-all@1.105.2
  - sass-embedded-win32-arm64@1.105.2
  - sass-embedded-win32-x64@1.105.2
  - sass-embedded@1.105.2
  - sass@1.105.2
  - vite-plus@1.3.0 || 1.4.0
  - browserslist@4.29.5
